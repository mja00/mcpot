# Full central stack: Postgres + server (API, migrates on boot) + web (dashboard). Daemons are NOT
# here — they deploy to VPSes from Dockerfile.daemon (see infra/README.md). Uses the GHCR images
# published by CI; to build from source instead, run from the repo root with
# `docker compose -f infra/docker-compose.full.yml up --build`.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mcpot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpot}
      POSTGRES_DB: mcpot
    volumes:
      - mcpot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpot -d mcpot"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    image: ghcr.io/mja00/mcpot-server:${MCPOT_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.server
    environment:
      DATABASE_URL: postgres://mcpot:${POSTGRES_PASSWORD:-mcpot}@postgres:5432/mcpot
      ADMIN_TOKEN: ${ADMIN_TOKEN:?set ADMIN_TOKEN}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      ABUSEIPDB_KEY: ${ABUSEIPDB_KEY:-}
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      ABUSEIPDB_DAILY_LIMIT: ${ABUSEIPDB_DAILY_LIMIT:-5000}
      ABUSEIPDB_CHECK_DAILY_LIMIT: ${ABUSEIPDB_CHECK_DAILY_LIMIT:-5000}
      ABUSEIPDB_CHECK_CACHE_HOURS: ${ABUSEIPDB_CHECK_CACHE_HOURS:-24}
      ABUSEIPDB_AUTO_REPORT: ${ABUSEIPDB_AUTO_REPORT:-true}
      ABUSEIPDB_AUTO_CHECK: ${ABUSEIPDB_AUTO_CHECK:-true}
      ABUSEIPDB_AUTO_REPORT_MIN_SCORE: ${ABUSEIPDB_AUTO_REPORT_MIN_SCORE:-60}
      ABUSEIPDB_AUTO_REPORT_MIN_HITS: ${ABUSEIPDB_AUTO_REPORT_MIN_HITS:-3}
      ABUSEIPDB_AUTO_REPORT_WINDOW_HOURS: ${ABUSEIPDB_AUTO_REPORT_WINDOW_HOURS:-24}
      GEOIP_DIR: /data/geoip
    volumes:
      - mcpot_geoip:/data/geoip:ro
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

  # Keeps GeoLite2 databases fresh on a shared volume; the server hot-reloads them. Optional:
  # without MaxMind credentials it exits and connections simply aren't geo-enriched.
  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    restart: unless-stopped
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-Country GeoLite2-ASN
      GEOIPUPDATE_FREQUENCY: "72"
    volumes:
      - mcpot_geoip:/usr/share/GeoIP

  web:
    image: ghcr.io/mja00/mcpot-web:${MCPOT_TAG:-latest}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    depends_on:
      - server
    ports:
      - "8081:80"

volumes:
  mcpot_pg:
  mcpot_geoip:
