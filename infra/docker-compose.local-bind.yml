# Override for running behind a local reverse proxy (e.g. nginx fronted by Cloudflare): only the
# dashboard is published, loopback-only. The dashboard's nginx proxies /v1/ to the server over the
# compose network, so daemons and admin API calls go through the same public URL. Layer it on:
# `docker compose -f infra/docker-compose.full.yml -f infra/docker-compose.local-bind.yml up -d`
services:
  server:
    ports: !reset []

  web:
    ports: !override
      - "127.0.0.1:8081:80"
