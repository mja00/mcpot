# Local central-stack dependencies. The server and web images are added in M5; for now this
# provides Postgres for development and the M2 integration tests.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mcpot
      POSTGRES_PASSWORD: mcpot
      POSTGRES_DB: mcpot
    ports:
      - "55432:5432"
    volumes:
      - mcpot_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mcpot -d mcpot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mcpot_pg:
